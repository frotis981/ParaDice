<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ParaDice RPG</title><link rel="stylesheet" href="style.css"></head><body><div class="container"><h1>🎲 ParaDice</h1><div id="characterCreation"><h2>Create Your Hero</h2><input type="text" id="playerName" placeholder="Hero Name"><select id="playerClass"><option>Warrior</option><option>Rogue</option><option>Mage</option></select><button onclick="createCharacter()">Start Adventure</button></div><div id="gameScreen" class="hidden"><div class="hero-card"><h2 id="heroName"></h2><p>Class: <span id="heroClass"></span></p><p>Level: <span id="level">1</span></p><p>EXP: <span id="exp">0</span>/100</p><p>HP: <span id="hp">100</span></p></div><div class="enemy-card"><h2 id="enemyName">Goblin</h2><p>HP: <span id="enemyHP">50</span></p></div><div class="actions"><button onclick="attack()">⚔ Attack</button><button onclick="defend()">🛡 Defend</button></div><div class="dice-box"><h2>D20 Roll</h2><div id="dice">20</div></div><div id="log"></div></div></div><script src="script.js"></script></body></html>
